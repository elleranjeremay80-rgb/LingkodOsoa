<meta charset="UTF-8">
<script>
// Keep any Supabase auth callback (#access_token=...&type=recovery, etc.)
// attached when forwarding - recovery links go straight to the reset page.
(function(){
    var target = /(^|[#?&])type=recovery(&|$)/.test(location.hash + "&" + location.search)
        ? "pages/reset-password/index.html"
        : "pages/login/index.html";
    location.replace(target + location.search + location.hash);
})();
</script>
