<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGKOD | Organization Directory</title>

<link rel="icon" href="../../pictures/BULSU.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../css/common.css?v=5">
<link rel="stylesheet" href="style.css?v=3">

</head>
<body>

<!-- Public, guest-accessible page - deliberately does NOT load js/common.js
     (it auth-redirects anyone without a session to Login) or js/auth.js.
     Only js/supabase.js, for a plain anon-role Supabase client. -->

<!-- Decorative background - purely visual, no functional role -->
<div class="org-browse-bg-decor" aria-hidden="true">
<div class="org-browse-bg-blob org-browse-bg-blob-1"></div>
<div class="org-browse-bg-blob org-browse-bg-blob-2"></div>
<svg class="org-browse-bg-wave" viewBox="0 0 800 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="waveGradOrg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#E73F1E"/>
<stop offset="55%" stop-color="#FB6C00"/>
<stop offset="100%" stop-color="#F9B637"/>
</linearGradient>
</defs>
<path fill="url(#waveGradOrg)" opacity="0.28" d="M0,180 C150,80 300,260 480,190 C620,140 720,240 800,200 L800,420 L0,420 Z"/>
<path fill="url(#waveGradOrg)" opacity="0.4" d="M0,240 C180,160 320,320 500,250 C640,200 720,300 800,260 L800,420 L0,420 Z"/>
</svg>
<div class="org-browse-bg-dots org-browse-bg-dots-tr"></div>
</div>

<div class="org-browse-page">

<div class="org-browse-topbar">

<div class="org-browse-brand">
<i class="fa-solid fa-building-columns"></i>
<span>LINGKOD Organization Directory</span>
</div>

<div class="org-browse-topbar-links">

<a href="../login/index.html" class="org-browse-back-btn">
<i class="fa-solid fa-arrow-left"></i> Back to Login
</a>

</div>

</div>

<div class="org-browse-hero">
<h1>Browse Student Organizations</h1>
<p>Explore accredited student organizations of the Office of Student Organization and Activities (OSOA) — Bulacan State University, Meneses Campus — before registering or logging in.</p>
</div>

<div class="org-browse-filters">

<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="orgBrowseSearch" placeholder="Search organizations by name or acronym...">
</div>

<select id="orgBrowseCategoryFilter">
<option value="">All Categories</option>
<option value="Academic">Academic</option>
<option value="Civic">Civic</option>
<option value="Religious">Religious</option>
<option value="Sports">Sports</option>
<option value="Cultural">Cultural</option>
<option value="Special Interest">Special Interest</option>
</select>

</div>

<div class="org-browse-grid" id="orgBrowseGrid"></div>

<div class="org-browse-empty hidden" id="orgBrowseEmpty">
<i class="fa-solid fa-folder-open"></i>
<p id="orgBrowseEmptyMessage">No organizations available at the moment.</p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="script.js?v=2"></script>
</body>
</html>
